apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: app-role
  namespace: satyam-app
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-role-binding
  namespace: satyam-app
subjects:
  - kind: ServiceAccount
    name: app-service-account
    namespace: satyam-app
roleRef:
  kind: Role
  name: app-role
  apiGroup: rbac.authorization.k8s.io
